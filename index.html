<style>
/* Layout: barra superior con pestañas, contenido a lo ancho; control = tabla tipo Excel, cotización = hoja REG MAN */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18242c; --muted:#5d6b75; --line:#d5dde3; --line2:#e7ecef;
  --brand:#0c769e; --brand-ink:#ffffff; --brand-soft:#e1f0f6; --red:#c73736;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#a86a00; --warn-soft:#fdf0d2; --bad:#c0352f; --bad-soft:#fbe0de;
  --label:#bfbfbf; --field:#fbfcfd;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171c; --panel:#172129; --ink:#e4ebef; --muted:#9aa9b3; --line:#2c3a44; --line2:#22303a;
  --brand:#3aa4cc; --brand-ink:#06151c; --brand-soft:#173a49; --red:#e2605f;
  --ok:#4cc37e; --ok-soft:#163a26; --warn:#e2a93c; --warn-soft:#3c2f13; --bad:#ec6a63; --bad-soft:#41201e;
  --label:#33424d; --field:#1b2730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --panel:#172129; --ink:#e4ebef; --muted:#9aa9b3; --line:#2c3a44; --line2:#22303a;
  --brand:#3aa4cc; --brand-ink:#06151c; --brand-soft:#173a49; --red:#e2605f;
  --ok:#4cc37e; --ok-soft:#163a26; --warn:#e2a93c; --warn-soft:#3c2f13; --bad:#ec6a63; --bad-soft:#41201e;
  --label:#33424d; --field:#1b2730; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:3px solid var(--brand)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:34px;width:auto;background:#fff;border-radius:4px;padding:2px 4px}

nav.tabs{display:flex;gap:6px}

nav.tabs a[aria-current="page"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding-block:18px 60px}

h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--brand)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.gh{margin:10px 0;padding:10px 12px;border:1px solid var(--brand);border-radius:10px;background:var(--panel)}.gh-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}.gh-h #gh-x{margin-left:auto;padding:2px 10px}.gh-f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.gh-f label{display:flex;flex-direction:column;font-size:12px;color:var(--label);gap:2px}.gh-f select{min-width:120px}.gh-g{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.gh-g>b{width:100%;font-size:12px;color:var(--label)}.gh-g button{font-weight:600}.gh-err{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.card h2{font-size:17px}
button.wa,.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;background:var(--brand-soft);border:1px solid var(--line)}
.banner.err{background:var(--bad-soft)}
/* resumen */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font-family:var(--f-head);font-size:26px;font-weight:700}
.tile .s{font-size:13px;color:var(--muted)}
.tile.ok{border-left:6px solid var(--ok)}.tile.warn{border-left:6px solid var(--warn)}.tile.bad{border-left:6px solid var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:10px 0}

/* seguimiento */
.folios{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}

.fol-body{display:grid;gap:8px;margin-top:8px}

/* tabla control */

table.ctl tr.r-aprobada td:first-child{box-shadow:inset 6px 0 0 var(--ok)}
table.ctl tr.r-pendiente td:first-child{box-shadow:inset 6px 0 0 var(--warn)}
table.ctl tr.r-rechazada td:first-child{box-shadow:inset 6px 0 0 var(--bad)}
table.ctl tr.r-aprobada{background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
table.ctl tr.r-rechazada{background:color-mix(in srgb,var(--bad-soft) 55%,transparent)}
.folio{font-weight:700;white-space:nowrap;color:var(--brand);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.num{text-align:right;white-space:nowrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.state{display:inline-flex;gap:4px}
.state button{padding:4px 8px;font-size:13px;border-radius:999px}
.state button.on.aprobada{background:var(--ok);border-color:var(--ok);color:#fff}
.state button.on.pendiente{background:var(--warn);border-color:var(--warn);color:#fff}
.state button.on.rechazada{background:var(--bad);border-color:var(--bad);color:#fff}
table.ctl tr.r-hist td{color:var(--muted)}
table.ctl tr.r-hist td:first-child{box-shadow:inset 6px 0 0 var(--line)}
.tag.hist{background:var(--line2);color:var(--muted)}
.why{font-size:12px;color:var(--bad)}
.pop{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pop button{font-size:12px;padding:4px 8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* hoja de cotización */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:16px}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.serie{display:flex;gap:8px;flex-wrap:wrap}
.serie label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.serie label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.serie input{width:auto}
.datos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--ink);font-size:14px}
.datos .col{display:grid;grid-template-columns:150px minmax(0,1fr)}
.datos .l{background:var(--label);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--ink);display:flex;align-items:center}
.datos .v{border-bottom:1px solid var(--ink);border-left:1px solid var(--ink);padding:2px}
.datos .col+.col{border-left:1px solid var(--ink)}
.datos .v input,.datos .v select{border:0;background:transparent;font-weight:700;text-transform:uppercase}
.datos .v.ro{padding:5px 8px;font-weight:700}
.datos .v input::placeholder,table.it input::placeholder{text-transform:none;font-weight:400}
.items{overflow-x:auto}
table.it{border-collapse:collapse;width:100%;min-width:960px;font-size:14px}
table.it th{background:var(--label);padding:6px;border:1px solid var(--ink);font-family:var(--f-head)}
table.it td{border-left:1px solid var(--ink);border-right:1px solid var(--ink);padding:2px}
table.it tr:last-child td{border-bottom:1px solid var(--ink)}
table.it input,table.it select{border:0;background:transparent;font-weight:700}
table.it input.desc{text-transform:uppercase}
table.it .c-m{width:150px}table.it .c-np{width:120px}table.it .c-co{width:110px;background:var(--warn-soft)}
table.it input.co{background:color-mix(in srgb,var(--warn-soft) 60%,transparent);font-weight:500}
table.it input.miss{background:var(--bad-soft);outline:1px solid var(--bad)}
table.it .c-q{width:80px}table.it .c-u{width:90px}table.it .c-p{width:120px}table.it .c-i{width:130px}table.it .c-x{width:40px}
table.it td.money{text-align:right;font-weight:700;padding-right:8px;white-space:nowrap}
table.it input.n{text-align:right}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:2px 8px}
.descs{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0}
.descs.fact.pend{border-color:var(--warn);background:var(--warn-soft)}
.descs legend{font-weight:700;padding:0 4px}
.dopt{display:flex;align-items:center;gap:6px}
.dopt input[type=radio]{width:auto}
.dopt.off{color:var(--muted)}
.dopt small{font-size:11px;color:var(--muted)}
.tot-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
.util{background:var(--ok-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex:1 1 320px;max-width:560px;display:grid;gap:4px}
.util.low{background:var(--bad-soft)}
.util .u-big{font-family:var(--f-head);font-size:22px;font-weight:700}
.util.low .u-big{color:var(--bad)}
.u-warn{color:var(--bad);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.totals{margin-left:auto;display:grid;grid-template-columns:auto 140px;justify-content:end;gap:0;font-weight:700}
.totals div{padding:4px 8px;border-bottom:1px solid var(--line)}
.totals .t{font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
.opts input[type=checkbox]{width:auto}
.opts input[type=number]{width:80px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.note-int{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.err-list{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.phone{font-size:13px;color:var(--muted);user-select:all}
@media (max-width:720px){
  .datos{grid-template-columns:1fr}.datos .col+.col{border-left:0;border-top:1px solid var(--ink)}
  .datos .col{grid-template-columns:120px minmax(0,1fr)}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><img src="logo.png" alt="Quarta Marchia"><div><b>Cotizaciones</b><small>Control diario y seguimiento</small></div></div>
  <nav class="tabs" aria-label="Secciones">

    <a href="#catalogos" id="tab-cat">Catálogos</a>

    <a href="#nueva" id="tab-nueva">+ Nueva cotización</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="empty">Cargando cotizaciones…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(Math.round((+n||0)*100)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num2=n=>(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dmy=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const daysBetween=(a,b)=>Math.floor((new Date(b+"T12:00:00")-new Date(a.slice(0,10)+"T12:00:00"))/864e5);
const nk=s=>norm(s).replace(/\b(\w+?)(ES|S)\b/g,"$1");
const norm=s=>String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9Ñ]+/g," ").trim();
const tabId=Math.random().toString(36).slice(2);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function calc(q){
  const sub=(q.items||[]).reduce((a,i)=>a+(+i.c||0)*(+i.p||0),0);
  const desc=sub*((+q.desc||0)/100);
  const base=sub-desc;
  const iva=q.sinIva?0:base*0.16;
  return {sub,desc,iva,total:base+iva};
}
const vehStr=q=>[q.modelo,q.anio,q.placa].filter(Boolean).join(" ");
const MOTIVOS=["Precio","Se lo llevó a otro taller","Lo hará después","Solo autorizó una parte","Otro"];

/* ---------- estado ---------- */
const S={db:null,dl:null,canWrite:true,quotes:new Map(),loaded:false,cat:[],cl:[],vh:[],cfg:{C:0,P:0},
  filt:{mes:todayISO().slice(0,7),estado:"todos",tipo:"todos",q:""},draft:null,editing:null,rejectOpen:null,err:null};

/* ---------- tarifas: costo con IVA → sin IVA → + margen según tipo de cliente ---------- */
const TAR_DEF={particular:45,ges:40,gobierno:55,integra:60,empresa:40,pmc:45,moGes:1000,moOtros:1500,socio:25,sabado:10,efectivo:20,efMargen:57,utilMin:15};
S.tar={...TAR_DEF};
const TAR_NOM={particular:"Particular",ges:"Grupo GES",gobierno:"Dependencia de gobierno",integra:"Integra",empresa:"Empresa con crédito",pmc:"PMC (sin IVA)"};
const EMPRESAS=["RECA","VALTOR","MSPV","PROEVENTOS","SAYER","FIN VIVIR"];
function tarifaAuto(d){const n=norm(d.cliente);if(/INTEGRA/.test(n))return "integra";if(/\bGES\b/.test(n))return "ges";if(/\bPMC\b/.test(n))return "pmc";
  if(d.credito)return EMPRESAS.some(e=>n.includes(e))?"empresa":"gobierno";return "particular"}
const tarifaDe=d=>d.tarifa||tarifaAuto(d);
// PMC: al costo con IVA se le suma el margen directo y su cotización no desglosa IVA
const estiloPMC=d=>tarifaDe(d)==="pmc"||descTipoDe(d)==="efectivo";
// en pago en efectivo las refacciones llevan su propio margen (57%) para que, tras el 20% de descuento, quede ~20% de utilidad
const margenDe=d=>descTipoDe(d)==="efectivo"?(+S.tar.efMargen||0):(+S.tar[tarifaDe(d)]||0);
const precioCot=(costo,d)=>Math.ceil(Math.round((estiloPMC(d)?+costo:+costo/1.16)*(1+margenDe(d)/100)*100)/100);
const precioRegla=(costo,t)=>Math.ceil(Math.round((t==="pmc"?+costo:+costo/1.16)*(1+(+S.tar[t]||0)/100)*100)/100); // se redondea a centavos antes de subir al peso, para evitar errores de decimales
const esMO=it=>/^MANO DE OBRA$/.test(norm(it.d));
const moDe=t=>t==="ges"?+S.tar.moGes:+S.tar.moOtros;

/* ---------- conexión ---------- */
(async function boot(){
  const claude=window.claude;
  if(!claude||!claude.use){S.err="Esta vista no puede conectarse a la base de datos. Abre la página desde Claude.";render();return}
  const [db,dl,user]=await Promise.all([claude.use("db"),claude.use("downloads"),claude.use("user")]);
  S.db=db;S.dl=dl;
  if(user){try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}try{S.isOwner=await user.isOwner()}catch(e){}}
  if(!db){S.err="Inicia sesión en Claude para ver y guardar cotizaciones.";render();return}
  const timer=setTimeout(()=>{if(!S.loaded){S.err="No se pudo conectar todavía. Revisa tu internet; la página seguirá intentando.";render()}},10000);
  db.collection("cot").orderBy("fecha","desc").limit(1000).onSnapshot(snap=>{
    S.quotes=new Map(snap.docs.map(d=>[d.id,d.data()]));
    if(!snap.metadata.fromCache){S.loaded=true;clearTimeout(timer);if(S.err&&S.err.startsWith("No se pudo"))S.err=null}
    render(true);
  },e=>{clearTimeout(timer);S.err="Se perdió la conexión con la base de datos ("+e.code+"). Vuelve a abrir la página.";render()});
  const sub=(path,fn)=>db.doc(path).onSnapshot(s=>{if(s.exists){fn(s.data());render(true)}},()=>{});
  sub("cat/refacciones",d=>{S.cat=d.items||[];S.catIdx=new Map();for(const i of S.cat){S.catIdx.set(nk(i.d+" "+(i.m||"")),i);if(!S.catIdx.has(nk(i.d)))S.catIdx.set(nk(i.d),i)}});
  sub("cat/clientes",d=>{S.cl=d.items||[];S.clIdx=new Map(S.cl.map(i=>[norm(i.n),i]))});

const HIST_MESES=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10"];
S.kat={periodo:"todo",base:"cotizadas",serv:false,q:"",orden:"piezas",verTodas:false,tipo:"todos",ordenC:"monto"};
function rangoMeses(per){
  const hoy=todayISO().slice(0,7);
  const add=(ym,n)=>{let [y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
  if(per==="todo")return ["2026-01",hoy];
  if(per==="3m")return [add(hoy,-2),hoy];
  if(per==="6m")return [add(hoy,-5),hoy];
  return [per,per];
}
const esServicio=r=>r.u==="SERV"||/MANO DE OBRA|BALANCEO|MONTAJE|ALINEACI|RECTIFICAD|NITROGENO|DIAGN|LIMPIEZA|SERVICIO|REVISION|ESCANE|AFINACION|INSTALACION|REPARACION|CAMBIO DE|LAVADO|TRASLADO|GRUA|RESCATE|HOJALATERIA|PINTURA|SOLDADURA|RECARGA|CARGA DE GAS|PROGRAMACION|CALIBRACION|AJUSTE|DESCARBONIZ|PURGADO|SANGRADO|MANTENIMIENTO|VERIFICACION|DESMONTAJE|PULIDO|ENCERADO|TAPICERIA|SUSPENSION COMPLETA/.test(norm(r.d));
function aggRefacciones(){
  const [a,b]=rangoMeses(S.kat.periodo);const m=new Map();
  const get=(d,u)=>{const k=nk(d);let e=m.get(k);if(!e){e={d,u,n:0,q:0,qa:0,p:0,f:""};m.set(k,e)}return e};
  for(const it of (S.statR&&S.statR.items)||[]){
    let n=0,q=0;HIST_MESES.forEach((ym,i)=>{if(ym>=a&&ym<=b){n+=it.v[i]||0;q+=it.m[i]||0}});
    if(!n)continue;const e=get(it.d,it.u);e.n+=n;e.q+=q;e.p=it.p;e.f=it.f;
  }
  for(const qt of S.quotes.values()){
    if(hist(qt))continue;const ym=qt.fecha.slice(0,7);if(ym<a||ym>b)continue;
    const seen=new Set();
    for(const it of qt.items||[]){const fd=fullDesc(it);const k=norm(fd);if(!k)continue;const e=get(fd,it.u);
      if(!seen.has(k)){e.n++;seen.add(k)}e.q+=+it.c||0;if(qt.estado==="aprobada")e.qa+=+it.c||0;
      if(qt.fecha>=e.f){e.f=qt.fecha;if(+it.p>0)e.p=+it.p;e.d=fd;e.u=it.u}}
  }
  let rows=[...m.values()];
  if(!S.kat.serv)rows=rows.filter(r=>!esServicio(r));
  if(S.kat.base==="aprobadas")rows=rows.filter(r=>r.qa>0);
  const qn=norm(S.kat.q);if(qn)rows=rows.filter(r=>norm(r.d).includes(qn));
  const key=S.kat.base==="aprobadas"?"qa":(S.kat.orden==="veces"?"n":"q");
  rows.sort((x,y)=>y[key]-x[key]||y.n-x.n);
  return rows;
}
function aggClientes(){
  const m=new Map();
  const get=n=>{const k=norm(n);let e=m.get(k);if(!e){e={n,tel:"",cred:false,k:0,t:0,ka:0,ta:0,f:"",pl:new Set()};m.set(k,e)}return e};
  for(const c of (S.statC&&S.statC.items)||[]){const e=get(c.n);e.tel=c.tel||e.tel;e.cred=e.cred||c.cred;e.k+=c.k;e.t+=c.t;e.f=c.f>e.f?c.f:e.f;(c.pl||[]).forEach(p=>e.pl.add(p))}
  for(const q of S.quotes.values()){
    if(hist(q)||!q.cliente)continue;const e=get(q.cliente);const t=calc(q).total;
    e.k++;e.t+=t;if(q.estado==="aprobada"){e.ka++;e.ta+=t}if(q.fecha>e.f)e.f=q.fecha;if(q.tel)e.tel=q.tel;e.cred=!!q.credito||e.cred;if(q.placa&&q.placa.length>=5)e.pl.add(norm(q.placa).replace(/ /g,"-"));
  }
  for(const c of S.cl){const e=m.get(norm(c.n));if(e){if(c.tel&&!e.tel)e.tel=c.tel}}
  let rows=[...m.values()];
  if(S.kat.tipo!=="todos")rows=rows.filter(r=>(S.kat.tipo==="credito")===r.cred);
  const qn=norm(S.kat.q);if(qn)rows=rows.filter(r=>norm(r.n+" "+r.tel).includes(qn));
  const o=S.kat.ordenC;rows.sort((x,y)=>o==="cot"?y.k-x.k:o==="ultima"?y.f.localeCompare(x.f):y.t-x.t);
  return rows;
}

function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function parecidos(nombre,tel){const a=norm(nombre),ta=a.split(" ").filter(w=>w.length>=3),tl=String(tel||"").replace(/\D/g,"");const r=[];
  for(const c of S.cl||[]){const b=norm(c.n);if(!b||b===a)continue;let s=0;
    if(tl.length>=10){if(String(c.tel||"").replace(/\D/g,"")===tl)r.push([3,c]);continue}
    const L=Math.max(a.length,b.length),dl=lev(a,b);if(dl<=Math.max(2,Math.floor(L*0.2)))s=Math.max(s,2.5-dl/L);
    const tb=b.split(" ").filter(w=>w.length>=3);
    if(ta.length&&tb.length){const hit=w=>tb.some(x=>x===w||(w.length>=5&&lev(w,x)<=1));const k=ta.filter(hit).length;
      if(k===ta.length||k===tb.length&&k>0)s=Math.max(s,1+k/Math.max(ta.length,tb.length))}
    if(s>0)r.push([s,c])}
  return r.sort((x,y)=>y[0]-x[0]).slice(0,3).map(x=>x[1])}

/* utilidad estimada (interna): lo que se cobra sin IVA menos el costo de proveedor sin IVA.

function utilidad(d){
  const t=tarifaDe(d);const f=1-(+d.desc||0)/100;let ing=0,cos=0,ingMO=0,sinCosto=0;
  for(const it of d.items||[]){if(!String(it.d||"").trim())continue;const venta=(+it.c||0)*(+it.p||0)*f;
    if(+it.costo>0){ing+=venta;cos+=(+it.c||0)*(estiloPMC(d)?+it.costo:+it.costo/1.16)}
    else if(!needsBrand(it)){ingMO+=venta}
    else sinCosto++;}
  const total=ing+ingMO,u=total-cos;
  return {u,pct:total>0?u/total*100:null,uRef:ing-cos,pctRef:ing>0?(ing-cos)/ing*100:null,ingMO,sinCosto,conCosto:ing>0};
}
const utilBaja=q=>{if(hist(q))return false;const u=utilidad(q);return u.pct!=null&&(u.conCosto||u.ingMO>0)&&u.pct<(+S.tar.utilMin||0)&&!q.autorizada};

function descTipoDe(d){if(d.descTipo)return d.descTipo;if(d.socio!=null)return "socio";return +d.desc?"otro":"ninguno"}
function elegible(d,tipo){const t=tarifaDe(d);
  if(tipo==="sabado"){if(!["particular","pmc"].includes(t))return "Solo para particulares y PMC";if(!esSabado(d.fecha))return "Solo cuando la fecha de emisión es sábado";return ""}
  if(tipo==="efectivo"){if(t!=="particular")return "Solo para clientes particulares";if(d.factura===true)return "No aplica si el cliente requiere factura";if(d.factura!==false)return "Primero pregunta si requiere factura";return ""}
  return ""}
function aplicarDescuento(d,tipo){const was=descTipoDe(d);
  if(tipo==="efectivo")d.sinIva=true;else if(was==="efectivo"&&tarifaDe(d)!=="pmc")d.sinIva=false;
  d.descTipo=tipo==="ninguno"?null:tipo;d.socio=tipo==="socio"?(d.socio||""):null;
  d.desc=tipo==="socio"?+S.tar.socio:tipo==="sabado"?+S.tar.sabado:tipo==="efectivo"?+S.tar.efectivo:tipo==="otro"?(+d.desc||0):0}
function revisarDescuento(d){const tipo=descTipoDe(d);if(tipo==="ninguno"||tipo==="otro"||tipo==="socio")return;const why=elegible(d,tipo);
  if(why){aplicarDescuento(d,"ninguno");toast("Se quitó "+DESC_NOM[tipo].toLowerCase()+": "+why.toLowerCase()+".")}}
const leyendaEfectivo=d=>{if(descTipoDe(d)!=="efectivo")return "";const ym=(d.fecha||todayISO()).slice(0,7);
  return `Descuento del ${+d.desc}% válido durante el mes de emisión de esta cotización (${MESES[+ym.slice(5)-1].toLowerCase()} de ${ym.slice(0,4)}) y aplica únicamente a pagos en efectivo.`};
function facturaHTML(d,H){if(tarifaDe(d)!=="particular")return "";const dis=H?"disabled":"";
  return `<fieldset class="descs fact ${d.factura==null?"pend":""}" ${dis}><legend>¿El cliente requiere factura? <span class="hint">(pregúntale siempre)</span></legend>
    <label class="dopt"><input type="radio" name="factura" value="si" ${d.factura===true?"checked":""}> Sí, con factura</label>
    <label class="dopt"><input type="radio" name="factura" value="no" ${d.factura===false?"checked":""}> No requiere factura</label>
    <span class="hint">${d.factura===true?"Se desglosa IVA. El descuento en efectivo no aplica.":d.factura===false?"Puedes ofrecerle el descuento por pago en efectivo.":""}</span></fieldset>`}
function descuentoHTML(d,H){const cur=descTipoDe(d);const dis=H?"disabled":"";
  const opt=(v,txt)=>{const why=v==="ninguno"?"":elegible(d,v);return `<label class="dopt ${why?"off":""}" title="${esc(why)}"><input type="radio" name="desc-tipo" value="${v}" ${cur===v?"checked":""} ${why||H?"disabled":""}> ${txt}${why?`<small>${esc(why)}</small>`:""}</label>`};
  return `<fieldset class="descs" ${dis}><legend>Descuento <span class="hint">(solo uno por cotización)</span></legend>
    ${opt("ninguno","Sin descuento")}${opt("sabado",`Sábado ${S.tar.sabado}%`)}${opt("efectivo",`Efectivo ${S.tar.efectivo}%`)}${opt("socio",`Socio ${S.tar.socio}%`)}${opt("otro","Otro")}
    ${cur==="socio"?`<label class="dopt">Recomendado por <input id="e-socio-n" list="dl-socios" value="${esc(d.socio||"")}" placeholder="Nombre del socio" style="width:180px"></label>`:""}
    ${cur==="efectivo"?`<div class="hint" style="flex-basis:100%">El PDF llevará al pie: “${esc(leyendaEfectivo(d))}”</div>`:""}
    ${cur==="otro"?`<label class="dopt"><input id="e-desc-otro" type="number" min="0" max="100" step="1" value="${esc(d.desc||0)}" style="width:70px"> %</label>`:""}
  </fieldset>`}
function recalcPrecios(d,prevT){revisarDescuento(d);const t=tarifaDe(d);if(estiloPMC(d))d.sinIva=true;else if(prevT==="pmc")d.sinIva=false;for(const it of d.items){if(it._pManual)continue;if(+it.costo>0)it.p=precioCot(it.costo,d);else if(esMO(it))it.p=moDe(t)}}
function needsBrand(it){return !(it.u==="SERV"||esServicio(it))}

function validate(d){
  const e=[];
  if(!d.cliente.trim())e.push("Falta el nombre del cliente.");
  if(!waNumber(d.tel))e.push("Falta el celular del cliente (10 dígitos). Sin él no se puede dar seguimiento por WhatsApp.");
  if(!d.items.some(i=>String(i.d).trim()))e.push("Agrega al menos una refacción o servicio.");
  if(tarifaDe(d)==="particular"&&d.factura==null)e.push("Pregúntale al cliente si requiere factura y márcalo antes de guardar.");
  const dt=descTipoDe(d);
  if(dt==="socio"&&!String(d.socio||"").trim())e.push("Escribe qué socio recomendó al cliente (descuento de socio).");
  if(dt==="sabado"||dt==="efectivo"){const why=elegible(d,dt);if(why)e.push(DESC_NOM[dt]+": "+why+".")}
  if(d.items.some(i=>String(i.d).trim()&&!(+i.c>0)))e.push("Hay renglones con cantidad en cero.");
  const sinMarca=d.items.filter(i=>String(i.d).trim()&&needsBrand(i)&&!String(i.m||"").trim());
  if(sinMarca.length)e.push("Falta la marca en: "+sinMarca.map(i=>i.d).join(", ")+". La marca es obligatoria en todas las refacciones (en servicios y mano de obra no aplica).");
  const sinParte=d.items.filter(i=>String(i.d).trim()&&needsBrand(i)&&!String(i.np||"").trim());
  if(sinParte.length)e.push("Falta el número de parte en: "+sinParte.map(i=>i.d).join(", ")+". Es obligatorio en todas las refacciones (ej. GP-6811). Búscalo con el botón Sugerir refacciones o en el catálogo de tu proveedor.");
  return e;
}
async function save(){
  const d=S.draft;const errs=validate(d);
  if(errs.length){S.showErr=true;renderSheet();$("#errs").innerHTML=errs.map(esc).join("<br>");$("#errs").scrollIntoView({block:"center"});return}
  S.showErr=false;
  const btn=$("#save");btn.disabled=true;btn.textContent="Guardando…";
  try{
    d.items=d.items.filter(i=>String(i.d).trim()).map(i=>({c:+i.c,u:i.u,d:String(i.d).trim().toUpperCase(),m:String(i.m||"").trim().toUpperCase(),...(String(i.np||"").trim()?{np:String(i.np).trim().toUpperCase()}:{}),p:Math.round((+i.p||0)*100)/100,costo:+i.costo||0}));
    d.tarifa=tarifaDe(d);
    if(!d.concepto.trim())d.concepto=d.items.filter(i=>!/MANO DE OBRA/.test(i.d)).map(i=>i.d.charAt(0)+i.d.slice(1).toLowerCase()).join(", ").slice(0,90);
    const now=new Date().toISOString();
    if(!d.folio){
      const n=await nextFolio(d.serie);
      d.num=n;d.folio="QM-COT-"+n+(d.serie==="P"?"A":"");d.creado=now;if(window.QM_NOMBRE)d.creadoPor=window.QM_NOMBRE();
    }
    if(d.autorizada&&!utilBaja({...d,autorizada:false}))d.autorizada=false;
    d.mod=now;if(window.QM_NOMBRE)d.modPor=window.QM_NOMBRE();
    const body=JSON.parse(JSON.stringify(d));
    await S.db.doc("cot/"+d.folio).set(body);
    S.quotes.set(d.folio,body);
    await learn(body);
    toast("Guardada como "+d.folio);
    S.editing=d.folio;history.replaceState(null,"","#editar-"+d.folio);render();
  }catch(e){toast("No se pudo guardar ("+(e.code||e.message||"error")+"). Intenta de nuevo.");btn.disabled=false;btn.textContent="Guardar cotización"}
}
async function nextFolio(serie){
  if(S.db.nextFolio)return S.db.nextFolio(serie); // versión independiente (Supabase): folio atómico en el servidor
  const ref=S.db.doc("cfg/folios");
  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder:tabId,ttlMs:6000});
    if(r.acquired){const s=await ref.get();const cur=(s.data()||{})[serie]||0;const n=cur+1;await ref.update({[serie]:n});return n}
    await new Promise(res=>setTimeout(res,700+Math.random()*600));
  }
  throw {code:"folio_ocupado",message:"Otra persona está guardando. Intenta en un momento."};
}
/* el catálogo aprende precios, clientes y vehículos de cada cotización guardada */
async function learn(q){
  try{
    const cat=S.cat.slice();const idx=new Map(cat.map((c,i)=>[nk(c.d),i]));let ch=false;
    for(const it of q.items){if(!(it.p>0))continue;const k=nk(it.d+" "+(it.m||""));const i=idx.has(k)?idx.get(k):idx.get(nk(it.d));
      const t=q.tarifa||"particular";
      if(i==null){cat.unshift({d:it.d,m:it.m||"",...(it.np?{np:it.np}:{}),u:it.u,p:it.p,n:1,pt:{[t]:it.p},...(it.costo>0?{co:it.costo,cof:q.fecha}:{})});[...idx.keys()].forEach(x=>idx.set(x,idx.get(x)+1));idx.set(k,0);ch=true}
      else{const o=cat[i];const pt={...(o.pt||{}),[t]:it.p};if(o.p!==it.p||o.u!==it.u||(it.np&&o.np!==it.np)||(it.m&&o.m!==it.m)||(o.pt||{})[t]!==it.p||(it.costo>0&&(o.co!==it.costo||o.cof!==q.fecha))){cat[i]={...o,...(it.np?{np:it.np}:{}),...(it.m?{m:it.m}:{}),p:it.p,u:it.u,pt,n:(o.n||0)+1,...(it.costo>0?{co:it.costo,cof:q.fecha}:{})};ch=true}}}
    if(ch)await S.db.doc("cat/refacciones").set({items:cat});
    const cl=S.cl.slice();const ci=cl.findIndex(c=>norm(c.n)===norm(q.cliente));
    const ce={n:q.cliente,tel:q.tel,cred:!!q.credito};
    if(ci<0||cl[ci].tel!==ce.tel||!!cl[ci].cred!==ce.cred){if(ci<0)cl.push(ce);else cl[ci]=ce;await S.db.doc("cat/clientes").set({items:cl})}
    if(q.placa&&q.placa.length>=5){const vh=S.vh.slice();const vi=vh.findIndex(v=>norm(v.pl)===norm(q.placa));
      const ve={pl:q.placa,a:q.anio,ma:q.marca,mo:q.modelo,km:q.km,cl:q.cliente};
      if(vi<0)vh.push(ve);else vh[vi]=ve;await S.db.doc("cat/vehiculos").set({items:vh})}
  }catch(e){/* el catálogo es una ayuda; si falla no bloquea la cotización */}
}

/* ---------- PDF idéntico al formato de Excel ---------- */
const ASSETS={};
async function loadAssets(){
  if(ASSETS.ok)return;
  const b64=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);const a=new Uint8Array(await r.arrayBuffer());let s="";for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
  const [r,b,logo,wm]=await Promise.all([b64("carlito-r.ttf"),b64("carlito-b.ttf"),b64("logo.png"),b64("marca-agua.png")]);
  Object.assign(ASSETS,{r,b,logo:"data:image/png;base64,"+logo,wm:"data:image/png;base64,"+wm,ok:true});
}
async function buildPDF(q,sinPrecio){
  await loadAssets();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"letter"});
  // el formato original de Excel imprime con la hoja desplazada 8.39 pt a la derecha y hacia abajo
